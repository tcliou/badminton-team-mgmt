name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# 在 GitHub Actions 把 Node 20 強制汰換之前先轉用 Node 24，避免 deprecation warning
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  quality:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (with coverage)
        run: pnpm test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      - name: Build
        env:
          # PR / CI build 不需要真實 supabase；給佔位字串避免 Vite 警告
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
          VITE_SYNTHETIC_EMAIL_DOMAIN: team.local
          VITE_APP_NAME: Badminton Team Manager
          VITE_BASE_PATH: /
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

  # ── Trivy 漏洞掃描（與 quality job 並行，不阻塞測試）──────────────────
  security-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write   # 上傳 SARIF 到 GitHub Security tab
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 掃 npm 依賴（pnpm-lock.yaml）
      - name: Run Trivy — npm dependencies
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          vuln-type: library           # 只看程式庫漏洞
          severity: HIGH,CRITICAL      # 只回報 HIGH 以上
          exit-code: 1                 # 發現漏洞就讓 CI 失敗（阻擋 merge）
          ignore-unfixed: true         # 跳過尚無官方修補的漏洞（避免誤報）
          trivyignores: .trivyignore   # 豁免清單（xlsx write-only CVEs）
          format: sarif
          output: trivy-results.sarif

      # 即使上一步失敗，仍上傳結果給 Security tab 檢視
      - name: Upload Trivy SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # ── Gitleaks 掃描 ───────────────────────────────────────────────────────────
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks Action
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Supabase Linter ─────────────────────────────────────────────────────────
  supabase-lint:
    name: Supabase DB Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase DB and Lint
        run: |
          supabase start
          supabase db lint
