name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 確保同一個 branch 不會有兩個 deploy 同時跑
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Node 20 actions 的過渡開關，2026/06 起會被強制
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 從 secrets 注入 Supabase 設定與 base path
      - name: Build production bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SYNTHETIC_EMAIL_DOMAIN: ${{ vars.VITE_SYNTHETIC_EMAIL_DOMAIN || 'team.local' }}
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME || '羽球校隊管理系統' }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}
        run: pnpm build

      # SPA 路由 fallback：public/404.html 已含 spa-github-pages 重導腳本，
      # Vite build 會自動把它複製到 dist/404.html，不需要再 cp index.html。

      # Jekyll 預設會吃掉 _ 開頭檔案；放空 .nojekyll 關掉
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # ── Edge Functions 部署（與 build 並行，不互相依賴）────────────────────
  deploy-functions:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy create-user \
            --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy update-user-status \
            --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy delete-user \
            --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy reset-user-password \
            --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

  # ── DB Migration（只套用尚未執行的 migration，不會刪資料）──────────────
  db-migrate:
    name: Apply DB Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push migrations to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase db push --linked

  # ── 等三個 job 都成功才 deploy Pages ────────────────────────────────────
  deploy:
    name: Deploy
    needs: [build, deploy-functions, db-migrate]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
